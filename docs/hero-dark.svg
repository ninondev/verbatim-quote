<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="title desc">
<title id="title">verbatim-quote: two quotes checked against one source, character by character</title>
<desc id="desc">The first quote differs from the source only in its dash and quotation marks: includes() misses it, verbatim-quote finds it. The second quote says 21 where the source says 18: a similarity score accepts it, verbatim-quote rejects it.</desc>
<metadata id="facts">{&quot;source&quot;: &quot;at least 18 years old — and “legal residents”&quot;, &quot;quotes&quot;: [{&quot;quote&quot;: &quot;at least 18 years old - and \&quot;legal residents\&quot;&quot;, &quot;includes&quot;: false, &quot;similarity&quot;: &quot;0.93&quot;, &quot;verbatim&quot;: true, &quot;start&quot;: 0, &quot;end&quot;: 45, &quot;differs_at&quot;: [22, 28, 44]}, {&quot;quote&quot;: &quot;at least 21 years old — and “legal residents”&quot;, &quot;includes&quot;: false, &quot;similarity&quot;: &quot;0.96&quot;, &quot;verbatim&quot;: false, &quot;differs_at&quot;: [9, 10]}], &quot;similarity&quot;: &quot;1 - levenshtein / length of the longer string, in code points, rounded to two decimals&quot;}</metadata>
<rect x="0.5" y="0.5" width="959" height="535" rx="16" fill="#141413" stroke="#2B2A27"/>
<text x="98" y="58" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#A09B90" text-anchor="start">THE PAGE SAYS</text>
<text x="863" y="58" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#A09B90" text-anchor="end">Typography folds by listed rules. Words and numbers must match.</text>
