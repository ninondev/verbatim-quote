<text x="608" y="281" font-family="Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" letter-spacing="0" fill="#ECE9E2" text-anchor="start">found at 0–45</text>
